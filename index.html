<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snake — Édition 2 Pommes</title>
    <style>
        body {
            background-color: #0f172a;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .container {
            text-align: center;
        }

        h1 {
            color: #22c55e;
            margin-bottom: 10px;
        }

        .score-board {
            font-size: 1.2rem;
            margin-bottom: 15px;
        }

        canvas {
            background-color: #020617;
            border: 3px solid #22c55e;
            border-radius: 8px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
        }

        .instructions {
            margin-top: 15px;
            font-size: 0.9rem;
            color: #94a3b8;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>SNAKE — 2 POMMES</h1>
        <div class="score-board">
            <span>Score : <strong id="score">0</strong></span>
        </div>
        <canvas id="gameCanvas" width="400" height="400"></canvas>
        <p class="instructions">Utilisez les flèches du clavier pour vous déplacer.</p>
    </div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        const gridSize = 20;
        const tileCount = canvas.width / gridSize;

        let score = 0;
        let snake = [{ x: 10, y: 10 }];
        let dx = 1;
        let dy = 0;
        let apples = [];

        function getRandomPosition() {
            let newPos;
            let collision;
            do {
                collision = false;
                newPos = {
                    x: Math.floor(Math.random() * tileCount),
                    y: Math.floor(Math.random() * tileCount)
                };

                for (let segment of snake) {
                    if (segment.x === newPos.x && segment.y === newPos.y) {
                        collision = true;
                        break;
                    }
                }

                for (let apple of apples) {
                    if (apple.x === newPos.x && apple.y === newPos.y) {
                        collision = true;
                        break;
                    }
                }
            } while (collision);

            return newPos;
        }

        function initApples() {
            apples = [];
            apples.push(getRandomPosition());
            apples.push(getRandomPosition());
        }

        document.addEventListener("keydown", changeDirection);

        function changeDirection(event) {
            const keyPressed = event.key;
            if ((keyPressed === "ArrowLeft" || keyPressed === "q") && dx === 0) {
                dx = -1; dy = 0;
            } else if ((keyPressed === "ArrowUp" || keyPressed === "z") && dy === 0) {
                dx = 0; dy = -1;
            } else if ((keyPressed === "ArrowRight" || keyPressed === "d") && dx === 0) {
                dx = 1; dy = 0;
            } else if ((keyPressed === "ArrowDown" || keyPressed === "s") && dy === 0) {
                dx = 0; dy = 1;
            }
        }

        function gameLoop() {
            const head = { x: snake[0].x + dx, y: snake[0].y + dy };

            if (head.x < 0 || head.x >= tileCount || head.y < 0 || head.y >= tileCount) {
                alert("Game Over ! Score final : " + score);
                resetGame();
                return;
            }

            for (let segment of snake) {
                if (segment.x === head.x && segment.y === head.y) {
                    alert("Game Over ! Score final : " + score);
                    resetGame();
                    return;
                }
            }

            snake.unshift(head);

            let ateAppleIndex = -1;
            for (let i = 0; i < apples.length; i++) {
                if (head.x === apples[i].x && head.y === apples[i].y) {
                    ateAppleIndex = i;
                    break;
                }
            }

            if (ateAppleIndex !== -1) {
                score += 10;
                document.getElementById("score").innerText = score;
                apples[ateAppleIndex] = getRandomPosition();
            } else {
                snake.pop();
            }

            drawGame();
        }

        function drawGame() {
            // Fond du plateau
            ctx.fillStyle = "#020617";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Dessin des 2 POMMES (rouges avec une petite tige)
            for (let apple of apples) {
                // Pomme rouge
                ctx.fillStyle = "#ef4444";
                ctx.beginPath();
                ctx.arc(
                    apple.x * gridSize + gridSize / 2,
                    apple.y * gridSize + gridSize / 2,
                    gridSize / 2 - 2,
                    0,
                    Math.PI * 2
                );
                ctx.fill();

                // Petite tige brune
                ctx.fillStyle = "#78350f";
                ctx.fillRect(apple.x * gridSize + gridSize / 2 - 1, apple.y * gridSize + 2, 2, 4);
            }

            // Dessin du SERPENT
            for (let i = 0; i < snake.length; i++) {
                let segment = snake[i];
                let x = segment.x * gridSize;
                let y = segment.y * gridSize;

                if (i === 0) {
                    // --- TÊTE DU SERPENT ---
                    ctx.fillStyle = "#15803d"; // Vert plus foncé pour la tête
                    ctx.beginPath();
                    ctx.arc(x + gridSize / 2, y + gridSize / 2, gridSize / 2, 0, Math.PI * 2);
                    ctx.fill();

                    // Yeux du serpent
                    ctx.fillStyle = "#ffffff"; // Blanc des yeux
                    let eyeOffset1 = { x: 5, y: 5 };
                    let eyeOffset2 = { x: 15, y: 5 };

                    if (dx === 1)  { eyeOffset1 = { x: 14, y: 5 };  eyeOffset2 = { x: 14, y: 15 }; } // Regard Droite
                    if (dx === -1) { eyeOffset1 = { x: 5, y: 5 };   eyeOffset2 = { x: 5, y: 15 }; }  // Regard Gauche
                    if (dy === 1)  { eyeOffset1 = { x: 5, y: 14 };  eyeOffset2 = { x: 15, y: 14 }; } // Regard Bas
                    if (dy === -1) { eyeOffset1 = { x: 5, y: 5 };   eyeOffset2 = { x: 15, y: 5 }; }  // Regard Haut

                    // Dessin des 2 globes oculaires
                    ctx.beginPath();
                    ctx.arc(x + eyeOffset1.x, y + eyeOffset1.y, 3, 0, Math.PI * 2);
                    ctx.arc(x + eyeOffset2.x, y + eyeOffset2.y, 3, 0, Math.PI * 2);
                    ctx.fill();

                    // Pupilles noires
                    ctx.fillStyle = "#000000";
                    ctx.beginPath();
                    ctx.arc(x + eyeOffset1.x, y + eyeOffset1.y, 1.5, 0, Math.PI * 2);
                    ctx.arc(x + eyeOffset2.x, y + eyeOffset2.y, 1.5, 0, Math.PI * 2);
                    ctx.fill();

                } else {
                    // --- CORPS DU SERPENT ---
                    ctx.fillStyle = "#22c55e"; // Vert fluo pour le corps
                    ctx.beginPath();
                    ctx.arc(x + gridSize / 2, y + gridSize / 2, gridSize / 2 - 1, 0, Math.PI * 2);
                    ctx.fill();
                }
            }
        }
