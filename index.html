<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snake — Édition 2 Pommes</title>
    <style>
        body {
            background-color: #0f172a;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .container {
            text-align: center;
            position: relative;
        }

        h1 {
            color: #22c55e;
            margin-bottom: 10px;
        }

        .score-board {
            font-size: 1.2rem;
            margin-bottom: 15px;
        }

        .game-wrapper {
            position: relative;
            width: 400px;
            height: 400px;
            margin: 0 auto;
        }

        canvas {
            background-color: #020617;
            border: 3px solid #22c55e;
            border-radius: 8px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            display: block;
        }

        /* Overlay pour les menus */
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(15, 23, 42, 0.9);
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
        }

        .hidden {
            display: none !important;
        }

        button {
            background-color: #22c55e;
            color: #020617;
            border: none;
            padding: 12px 24px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 15px;
        }

        button:hover {
            background-color: #16a34a;
            color: #ffffff;
        }

        .instructions {
            margin-top: 15px;
            font-size: 0.9rem;
            color: #94a3b8;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>SNAKE — 2 POMMES</h1>
        <div class="score-board">
            <span>Score : <strong id="score">0</strong></span> | 
            <span>Meilleur : <strong id="best-score">0</strong></span>
        </div>

        <div class="game-wrapper">
            <!-- Canvas du jeu -->
            <canvas id="gameCanvas" width="400" height="400"></canvas>

            <!-- Écran 1 : Menu Principal -->
            <div id="menu-screen" class="overlay">
                <h2>Prêt à jouer ?</h2>
                <p>Mange les 2 pommes pour marquer des points !</p>
                <button onclick="startGame()">JOUER</button>
            </div>

            <!-- Écran 2 : Game Over -->
            <div id="game-over-screen" class="overlay hidden">
                <h2 style="color: #ef4444;">GAME OVER</h2>
                <p>Score final : <span id="final-score">0</span></p>
                <button onclick="startGame()">REJOUER</button>
            </div>
        </div>

        <p class="instructions">Utilisez les flèches du clavier (ou Z, Q, S, D) pour vous déplacer.</p>
    </div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        const menuScreen = document.getElementById("menu-screen");
        const gameOverScreen = document.getElementById("game-over-screen");

        const gridSize = 20;
        const tileCount = canvas.width / gridSize;

        let score = 0;
        let bestScore = 0;
        let snake = [];
        let dx = 1;
        let dy = 0;
        let apples = [];
        let gameInterval = null;
        let gameRunning = false;

        function getRandomPosition() {
            let newPos;
            let collision;
            do {
                collision = false;
                newPos = {
                    x: Math.floor(Math.random() * tileCount),
                    y: Math.floor(Math.random() * tileCount)
                };

                for (let segment of snake) {
                    if (segment.x === newPos.x && segment.y === newPos.y) {
                        collision = true;
                        break;
                    }
                }

                for (let apple of apples) {
                    if (apple.x === newPos.x && apple.y === newPos.y) {
                        collision = true;
                        break;
                    }
                }
            } while (collision);

            return newPos;
        }

        function initApples() {
            apples = [];
            apples.push(getRandomPosition());
            apples.push(getRandomPosition());
        }

        document.addEventListener("keydown", changeDirection);

        function changeDirection(event) {
            if (!gameRunning) return;

            const keyPressed = event.key;
            if ((keyPressed === "ArrowLeft" || keyPressed === "q" || keyPressed === "Q") && dx === 0) {
                dx = -1; dy = 0;
            } else if ((keyPressed === "ArrowUp" || keyPressed === "z" || keyPressed === "Z") && dy === 0) {
                dx = 0; dy = -1;
            } else if ((keyPressed === "ArrowRight" || keyPressed === "d" || keyPressed === "D") && dx === 0) {
                dx = 1; dy = 0;
            } else if ((keyPressed === "ArrowDown" || keyPressed === "s" || keyPressed === "S") && dy === 0) {
                dx = 0; dy = 1;
            }
        }

        function startGame() {
            // Masquer les overlays
            menuScreen.classList.add("hidden");
            gameOverScreen.classList.add("hidden");

            // Réinitialiser les données
            score = 0;
            document.getElementById("score").innerText = score;
            snake = [{ x: 10, y: 10 }];
            dx = 1;
            dy = 0;
            initApples();

            // Lancer la boucle de jeu
            gameRunning = true;
            if (gameInterval) clearInterval(gameInterval);
            gameInterval = setInterval(gameLoop, 120);
        }

        function gameOver() {
            gameRunning = false;
            clearInterval(gameInterval);

            // Mise à jour des scores
            if (score > bestScore) {
                bestScore = score;
                document.getElementById("best-score").innerText = bestScore;
            }

            document.getElementById("final-score").innerText = score;
            gameOverScreen.classList.remove("hidden");
        }

        function gameLoop() {
            const head = { x: snake[0].x + dx, y: snake[0].y + dy };

            // Collisions murs
            if (head.x < 0 || head.x >= tileCount || head.y < 0 || head.y >= tileCount) {
                gameOver();
                return;
            }

            // Collisions soi-même
            for (let segment of snake) {
                if (segment.x === head.x && segment.y === head.y) {
                    gameOver();
                    return;
                }
            }

            snake.unshift(head);

            // Manger une pomme
            let ateAppleIndex = -1;
            for (let i = 0; i < apples.length; i++) {
                if (head.x === apples[i].x && head.y === apples[i].y) {
                    ateAppleIndex = i;
                    break;
                }
            }

            if (ateAppleIndex !== -1) {
                score += 10;
                document.getElementById("score").innerText = score;
                apples[ateAppleIndex] = getRandomPosition();
            } else {
                snake.pop();
            }

            drawGame();
        }

        function drawGame() {
            ctx.fillStyle = "#020617";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Dessin des 2 POMMES
            for (let apple of apples) {
                ctx.fillStyle = "#ef4444";
                ctx.beginPath();
                ctx.arc(
                    apple.x * gridSize + gridSize / 2,
                    apple.y * gridSize + gridSize / 2,
                    gridSize / 2 - 2,
                    0,
                    Math.PI * 2
                );
                ctx.fill();

                ctx.fillStyle = "#78350f";
                ctx.fillRect(apple.x * gridSize + gridSize / 2 - 1, apple.y * gridSize + 2, 2, 4);
            }

            // Dessin du SERPENT
            for (let i = 0; i < snake.length; i++) {
                let segment = snake[i];
                let x = segment.x * gridSize;
                let y = segment.y * gridSize;

                if (i === 0) {
                    ctx.fillStyle = "#15803d";
                    ctx.beginPath();
                    ctx.arc(x + gridSize / 2, y + gridSize / 2, gridSize / 2, 0, Math.PI * 2);
                    ctx.fill();

                    ctx.fillStyle = "#ffffff";
                    let eyeOffset1 = { x: 5, y: 5 };
                    let eyeOffset2 = { x: 15, y: 5 };

                    if (dx === 1)  { eyeOffset1 = { x: 14, y: 5 };  eyeOffset2 = { x: 14, y: 15 }; }
                    if (dx === -1) { eyeOffset1 = { x: 5, y: 5 };   eyeOffset2 = { x: 5, y: 15 }; }
                    if (dy === 1)  { eyeOffset1 = { x: 5, y: 14 };  eyeOffset2 = { x: 15, y: 14 }; }
                    if (dy === -1) { eyeOffset1 = { x: 5, y: 5 };   eyeOffset2 = { x: 15, y: 5 }; }

                    ctx.beginPath();
                    ctx.arc(x + eyeOffset1.x, y + eyeOffset1.y, 3, 0, Math.PI * 2);
                    ctx.arc(x + eyeOffset2.x, y + eyeOffset2.y, 3, 0, Math.PI * 2);
                    ctx.fill();

                    ctx.fillStyle = "#000000";
                    ctx.beginPath();
                    ctx.arc(x + eyeOffset1.x, y + eyeOffset1.y, 1.5, 0, Math.PI * 2);
                    ctx.arc(x + eyeOffset2.x, y + eyeOffset2.y, 1.5, 0, Math.PI * 2);
                    ctx.fill();

                } else {
                    ctx.fillStyle = "#22c55e";
                    ctx.beginPath();
                    ctx.arc(x + gridSize / 2, y + gridSize / 2, gridSize / 2 - 1, 0, Math.PI * 2);
                    ctx.fill();
                }
            }
        }

        // Dessin initial au chargement
        drawGame();
    </script>
</body>
</html>
