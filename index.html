<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snake — Édition 2 Pommes</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>SNAKE — 2 POMMES</h1>
        <div class="score-board">
            <span>Score : <strong id="score">0</strong></span> | 
            <span>Meilleur : <strong id="best-score">0</strong></span>
        </div>

        <div class="game-wrapper">
            <canvas id="gameCanvas" width="400" height="400"></canvas>

            <div id="menu-screen" class="overlay">
                <h2>Prêt à jouer ?</h2>
                <p>Mange les 2 pommes pour marquer des points !</p>
                <button onclick="startGame()">JOUER</button>
            </div>

            <div id="game-over-screen" class="overlay hidden">
                <h2 style="color: #ef4444;">GAME OVER</h2>
                <p>Score final : <span id="final-score">0</span></p>
                <button onclick="startGame()">REJOUER</button>
            </div>
        </div>

        <p class="instructions">Utilisez les flèches du clavier (ou Z, Q, S, D) pour vous déplacer.</p>
    </div>

    <script src="script.js"></script>
</body>
</html>
